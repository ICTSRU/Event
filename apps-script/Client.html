<script>
/* SRU Event Attendance & Management Platform — secure client (v4.1)
 * Runs inside the Apps Script web app (SRU Secure Access Kit). All admin calls go through
 * google.script.run.api(action, payload); the server re-checks the Google account on every call.
 * Expects window.EA_SERVER = { user, platformUrl, config } rendered by securePage_().
 */
(function () {
  const S = window.EA_SERVER || {};
  const cfg = window.EA_CONFIG = Object.assign({ VERSION: '', CHECKIN_PAGE: 'checkin.html' }, S.config || {});
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icons = () => { try { lucide.createIcons(); } catch (e) {} };

  function store(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k);
      if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
    } catch (e) { return null; }
  }

  function call(action, payload) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(r => {
          if (r && r.ok === false) reject(Object.assign(new Error(r.error || 'Request failed'), { data: r }));
          else resolve(r);
        })
        .withFailureHandler(e => reject(new Error(String(e && e.message || e).replace(/^Exception:\s*/, ''))))
        .api(action, payload || {});
    });
  }

  /* logos (Logos.html → ITOC_LOGOS) */
  function logos() {
    document.querySelectorAll('img[data-logo]').forEach(img => { img.src = (window.ITOC_LOGOS || {})[img.getAttribute('data-logo')] || ''; });
  }
  document.addEventListener('DOMContentLoaded', logos);

  /* links between the secure pages must open at the top window (the page runs inside Google's frame) */
  function pageUrl(page) { return S.platformUrl ? S.platformUrl + (page ? '?page=' + page : '') : ''; }
  function wireLinks() {
    document.querySelectorAll('a[data-page]').forEach(a => {
      const u = pageUrl(a.getAttribute('data-page'));
      if (u) { a.href = u; a.target = '_top'; }
      else a.addEventListener('click', ev => { ev.preventDefault(); toast('اضبط «رابط المنصة الآمن» من ⚙ الإعدادات أولًا'); });
    });
  }
  document.addEventListener('DOMContentLoaded', wireLinks);

  function toast(t) {
    const el = $('toast'); if (!el) return alert(t);
    el.textContent = t; el.classList.add('show'); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('show'), 3200);
  }
  function msg(id, type, text) { $(id).innerHTML = text ? '<div class="alert ' + type + '">' + esc(text) + '</div>' : ''; }
  function busy(b, on) { if (on) { b._h = b.innerHTML; b.disabled = true; b.innerHTML = '<span class="spinner"></span>'; } else { b.disabled = false; b.innerHTML = b._h; icons(); } }

  /* ---------------- modal ---------------- */
  function ensureModal() {
    if ($('eaModal')) return;
    const d = document.createElement('div');
    d.innerHTML = '<div id="eaModal" class="ea-modal hidden" role="dialog" aria-modal="true"><div class="ea-modal-card"><div class="ea-modal-hd"><b id="eaModalTitle"></b><button type="button" id="eaModalX" class="ea-x" title="إغلاق">✕</button></div><div id="eaModalBody"></div></div></div>';
    document.body.appendChild(d.firstChild);
    $('eaModalX').onclick = closeModal;
  }
  function openModal(title, html) { ensureModal(); $('eaModalTitle').innerHTML = title; $('eaModalBody').innerHTML = html; $('eaModal').classList.remove('hidden'); document.body.classList.add('ea-locked'); icons(); }
  function closeModal() { $('eaModal').classList.add('hidden'); document.body.classList.remove('ea-locked'); }

  /* ---------------- user menu ---------------- */
  const USER = S.user || {};
  function renderBox() {
    const box = $('authBox'); if (!box) return;
    box.innerHTML =
      '<span class="ea-user" title="مسجّل الدخول بحساب الجامعة"><i data-lucide="shield-check"></i> <span dir="ltr">' + esc(USER.email || '') + '</span>' +
      ' <span class="ea-role">' + esc(USER.roleLabel || '') + '</span></span>' +
      (USER.role === 'admin'
        ? '<button type="button" class="btn secondary sm" id="eaBtnUsers"><i data-lucide="users"></i> المستخدمون</button>' +
          '<button type="button" class="btn secondary sm" id="eaBtnSet" title="الإعدادات"><i data-lucide="settings"></i></button>'
        : '');
    if ($('eaBtnUsers')) $('eaBtnUsers').onclick = manageUsers;
    if ($('eaBtnSet')) $('eaBtnSet').onclick = settings;
    icons();
  }

  /* ---------------- users = AllowedUsers sheet (admins) ---------------- */
  async function manageUsers() {
    openModal('<i data-lucide="users"></i> المصرّح لهم بالدخول <span class="en muted small">AllowedUsers</span>', '<div class="empty"><span class="spinner dark"></span></div>');
    let r;
    try { r = await call('listUsers'); } catch (e) { $('eaModalBody').innerHTML = '<div class="alert err">' + esc(e.message) + '</div>'; return; }
    const roles = r.roles || {};
    const roleSel = (cls, v, extra) => '<select class="' + cls + '"' + (extra || '') + '>' + Object.keys(roles).map(k => '<option value="' + k + '"' + (k === v ? ' selected' : '') + '>' + esc(roles[k]) + '</option>').join('') + '</select>';
    $('eaModalBody').innerHTML =
      (r.mode === 'DOMAIN' ? '<div class="alert info">الوضع الحالي <b>DOMAIN</b>: يدخل أي حساب جامعي @sr.edu.sa؛ القائمة تحدد صلاحية المسؤول فقط.</div>' : '') +
      '<div class="ea-add">' +
      ' <input id="eaUEmail" type="email" class="en" placeholder="name@sr.edu.sa" aria-label="E-mail">' +
      ' <input id="eaUName" placeholder="الاسم" aria-label="Name">' + roleSel('', 'user', ' id="eaURole"') +
      ' <button class="btn" id="eaUAdd"><i data-lucide="user-plus"></i> إضافة</button>' +
      '</div>' +
      '<label class="ea-check" style="margin:0 0 10px"><input type="checkbox" id="eaUNotify" checked> إرسال إشعار بالبريد للمستخدم الجديد برابط المنصة</label>' +
      '<div class="small muted" style="margin:-4px 0 10px">الدخول بحساب Google الجامعي فقط — لا توجد كلمات مرور خاصة بالمنصة. التغييرات تسري خلال دقيقتين.</div>' +
      '<div id="eaUMsg"></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>المستخدم</th><th>الصلاحية</th><th>الحالة</th><th>آخر دخول</th><th></th></tr></thead><tbody>' +
      r.users.map(u => '<tr data-email="' + esc(u.email) + '">' +
        '<td><b>' + esc(u.name || '—') + '</b><div class="small en muted" style="display:block;text-align:right">' + esc(u.email) + '</div></td>' +
        '<td>' + (u.owner || u.email === USER.email ? esc(u.roleLabel) + (u.owner ? ' <span class="chip demo">المالك</span>' : '') : roleSel('eaRole', u.role, ' data-name="' + esc(u.name) + '"')) + '</td>' +
        '<td>' + (u.active ? '<span class="chip open">مفعّل</span>' : '<span class="chip closed">موقوف</span>') + '</td>' +
        '<td class="small"><span class="en">' + esc(u.lastLogin || '—') + '</span></td>' +
        '<td style="white-space:nowrap">' + (u.owner || u.email === USER.email ? '<span class="small muted">' + (u.email === USER.email ? 'أنت' : '') + '</span>' :
          '<button class="btn ' + (u.active ? 'danger' : 'secondary') + ' sm eaToggle">' + (u.active ? 'إيقاف' : 'تفعيل') + '</button>') + '</td></tr>').join('') +
      '</tbody></table></div>' +
      '<p class="small muted" style="margin-bottom:0">يمكن أيضًا التعديل مباشرة في ورقة <span class="en">AllowedUsers</span>، وسجل الدخول الكامل في ورقة <span class="en">AccessLog</span>.</p>';
    icons();
    $('eaUAdd').onclick = async () => {
      const email = $('eaUEmail').value.trim().toLowerCase(), name = $('eaUName').value.trim();
      if (!/^[^\s@]+@sr\.edu\.sa$/i.test(email)) return msg('eaUMsg', 'err', 'أدخل بريدًا جامعيًا ينتهي بـ @sr.edu.sa');
      const b = $('eaUAdd'); busy(b, true);
      try {
        const x = await call('saveUser', { email: email, name: name, role: $('eaURole').value, notify: $('eaUNotify').checked });
        toast(x.created ? 'أُضيف المستخدم' + ($('eaUNotify').checked ? ' وأُرسل إشعار بالبريد' : '') : 'تم تحديث المستخدم');
        manageUsers();
      } catch (e) { msg('eaUMsg', 'err', e.message); busy(b, false); }
    };
    $('eaModalBody').querySelectorAll('tr[data-email]').forEach(tr => {
      const email = tr.dataset.email, tg = tr.querySelector('.eaToggle'), sel = tr.querySelector('.eaRole');
      if (tg) tg.onclick = async () => {
        const act = tg.textContent.trim() === 'تفعيل'; busy(tg, true);
        try { await call('setUserActive', { email: email, active: act }); manageUsers(); }
        catch (e) { msg('eaUMsg', 'err', e.message); busy(tg, false); }
      };
      if (sel) sel.onchange = async () => {
        try { await call('saveUser', { email: email, name: sel.dataset.name, role: sel.value, notify: false }); toast('تم تحديث الصلاحية'); }
        catch (e) { msg('eaUMsg', 'err', e.message); }
      };
    });
  }

  /* ---------------- settings (admins) ---------------- */
  function settings() {
    openModal('<i data-lucide="settings"></i> إعدادات المنصة <span class="en muted small">Settings</span>',
      '<label class="f">رابط صفحات الزوار على GitHub <span class="en">Public pages (checkin.html / feedback.html)</span></label>' +
      '<input id="eaSPub" class="en" style="width:100%" placeholder="https://ictsru.github.io/event-attendance/" value="' + esc(cfg.PUBLIC_URL || '') + '">' +
      '<div class="small muted">يُستخدم داخل رمز QR وروابط التقييم — يجب أن يفتح على الجوال.</div>' +
      '<label class="f" style="margin-top:12px">رابط المنصة الآمن <span class="en">Secure web app (…/exec — Anyone within SRU)</span></label>' +
      '<input id="eaSPlat" class="en" style="width:100%" placeholder="https://script.google.com/a/macros/sr.edu.sa/s/…/exec" value="' + esc(S.platformUrl || '') + '">' +
      '<div class="small muted">للتنقل بين لوحة الإدارة ولوحة المؤشرات.</div>' +
      '<label class="f" style="margin-top:12px">رابط صفحة الدخول <span class="en">Landing page (GitHub)</span></label>' +
      '<input id="eaSLand" class="en" style="width:100%" placeholder="https://ictsru.github.io/event-attendance/">' +
      '<div class="small muted">يُرسل في إشعار المستخدمين الجدد.</div><div id="eaSMsg"></div>' +
      '<div class="actions" style="margin-top:12px"><button class="btn" id="eaSSave"><i data-lucide="save"></i> حفظ</button></div>');
    $('eaSSave').onclick = async () => {
      const b = $('eaSSave'); busy(b, true);
      try {
        const r = await call('saveSettings', { publicUrl: $('eaSPub').value, platformUrl: $('eaSPlat').value, landingUrl: $('eaSLand').value });
        cfg.PUBLIC_URL = r.publicUrl; S.platformUrl = r.platformUrl; wireLinks();
        closeModal(); toast('تم حفظ الإعدادات');
        if (typeof window.EA_onSettings === 'function') window.EA_onSettings();
      } catch (e) { msg('eaSMsg', 'err', e.message); busy(b, false); }
    };
  }

  window.EA = {
    call: call, cfg: cfg, store: store, isDemo: () => false, apiUrl: () => '', cleanUrl: x => x, token: () => '',
    pageUrl: pageUrl, logos: logos,
    auth: {
      require: cb => { renderBox(); cb(USER); },
      user: () => USER,
      settings: settings,
      users: manageUsers
    }
  };
})();
</script>
