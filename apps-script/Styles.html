<style>
/* SRU theme — copied from github/assets/sru-theme.css (v4.7) */
/* SRU Event Attendance & Management Platform — shared theme (v4.7) — tokens from SRU_IDENTITY.md */
:root{
  --purple:#501e8c; --purple-dark:#3a1464; --purple-light:#f0ebf8;
  --blue:#0a6eaa; --blue-light:#e6f3fa;
  --bg:#f7f5fb; --ink:#241436; --muted:#6b5a80;
  --border:rgba(80,30,140,.12); --radius:4px;
  --ok:#1e7d4f; --ok-bg:#e7f5ee; --warn:#9a5b00; --warn-bg:#fff4e0; --err:#b3261e; --err-bg:#fdecea;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)} .small{font-size:12.5px}
a{color:var(--blue)}

/* Header band */
.brand-band{background:#fff;border-bottom:1px solid var(--border)}
.brand-band .inner{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-band img{height:52px;width:auto;max-width:46vw;object-fit:contain}
@media(max-width:520px){.brand-band img{height:36px}}
.brand-band .fallback{font-weight:700;color:var(--purple);font-size:13px;line-height:1.3}
.topbar{background:var(--purple-dark);color:#fff}
.navbar{background:var(--purple);color:#fff}
.navbar .inner{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.navbar h1{margin:0;font-size:19px;font-weight:700}
/* platform logo (v4.4) */
.nav-brand{display:flex;align-items:center;gap:12px}
.nav-brand .nav-mark{width:46px;height:46px;flex:none}
@media(max-width:520px){.nav-brand .nav-mark{width:36px;height:36px}}
.navbar .sub{font-size:12px;opacity:.85}
.ver{background:rgba(255,255,255,.16);border-radius:var(--radius);padding:2px 8px;font-size:12px;font-weight:600}
.diag{height:4px;background:repeating-linear-gradient(-45deg,var(--blue) 0 10px,#2b8bc4 10px 20px)}

.container{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:17px;color:var(--purple);display:flex;align-items:center;gap:8px}
.card h3{margin:16px 0 8px;font-size:15px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--radius);border:1px solid var(--purple);background:var(--purple);color:#fff;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--purple-dark)}
.btn.secondary{background:#fff;color:var(--purple)}
.btn.secondary:hover{background:var(--purple-light)}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.btn.danger{background:#fff;color:var(--err);border-color:var(--err)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* Forms */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
@media(max-width:720px){.g2{grid-template-columns:1fr}}
label.f{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px}
label.f .en{font-weight:400;color:var(--muted);font-size:12px;margin-inline-start:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid rgba(80,30,140,.25);border-radius:var(--radius);padding:9px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(10,110,170,.35);border-color:var(--blue)}
textarea{min-height:110px;resize:vertical}
.req{color:var(--err)}

/* Chips / alerts */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.chip.open{background:var(--ok-bg);color:var(--ok)}
.chip.closed{background:#eee;color:#555}
.chip.demo{background:var(--warn-bg);color:var(--warn)}
.alert{border-radius:var(--radius);padding:10px 12px;margin:10px 0;font-size:14px}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert.err{background:var(--err-bg);color:var(--err)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.info{background:var(--blue-light);color:var(--blue)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--purple-light);color:var(--purple-dark);text-align:start;padding:9px 10px;font-weight:700;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}
tr:nth-child(even) td{background:#fcfbfe}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--border);border-top:3px solid var(--purple);border-radius:var(--radius);padding:12px}
.kpi .v{font-size:24px;font-weight:700;color:var(--purple-dark)}
.kpi .l{font-size:12.5px;color:var(--muted)}

/* Footer */
footer.foot{border-top:1px solid var(--border);background:#fff}
footer.foot .inner{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
footer.foot img{height:34px}

.toast{position:fixed;inset-inline-start:16px;bottom:16px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--radius);font-size:14px;z-index:99;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:none}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.spinner.dark{border-color:rgba(80,30,140,.2);border-top-color:var(--purple)}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}

@media print{
  .no-print{display:none!important}
  body{background:#fff}
  .card{border:none;padding:0}
  @page{size:A4;margin:16mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---------- Sign-in & user management (v3.3) ---------- */
body.ea-locked{overflow:hidden}
.ea-login{position:fixed;inset:0;z-index:200;background:var(--bg);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px}
.ea-login-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px rgba(58,20,100,.10);overflow:hidden}
.ea-login-logos{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;gap:10px}
.ea-login-logos img{height:40px;max-width:46%;object-fit:contain}
.ea-login-band{background:var(--purple);color:#fff;padding:14px 18px}
.ea-login-band .t{font-weight:700;font-size:17px}
.ea-login-band .s{font-size:12px;opacity:.85;display:block}
.ea-login-body{padding:18px}
.ea-login-body h2{margin:0 0 14px;font-size:17px;color:var(--purple-dark)}
.ea-login-foot{border-top:1px solid var(--border);padding:10px 18px;font-size:12px;color:var(--muted);text-align:center}
.ea-full{width:100%;padding:11px;font-size:15px;margin-top:14px}
.ea-link{background:none;border:none;font:inherit;font-size:13px;color:var(--blue);cursor:pointer;margin-top:10px;padding:4px 0;display:block;width:100%;text-align:center}
.ea-link:hover{text-decoration:underline}
.ea-check{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:12px;cursor:pointer}
.ea-check input{width:auto}
.ea-pw{position:relative}
.ea-pw input{padding-inline-end:40px}
.ea-eye{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--muted);cursor:pointer;padding:6px;display:flex}
.ea-eye svg{width:17px;height:17px}
.ea-code{font-size:22px;letter-spacing:8px;text-align:center;width:100%}
.ea-user{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:#fff;background:rgba(255,255,255,.14);border-radius:var(--radius);padding:4px 9px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ea-user svg{width:15px;height:15px}
.ea-role{font-size:11px;opacity:.8}
.ea-modal{position:fixed;inset:0;z-index:150;background:rgba(36,20,54,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.ea-modal-card{background:#fff;border-radius:var(--radius);width:100%;max-width:760px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.ea-modal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ea-modal-hd b{color:var(--purple-dark);font-size:16px;display:flex;align-items:center;gap:6px}
.ea-modal-hd svg{width:18px;height:18px}
.ea-x{border:none;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
.ea-add{display:grid;grid-template-columns:1.4fr 1fr 150px auto;gap:6px;margin-bottom:8px}
@media(max-width:640px){.ea-add{grid-template-columns:1fr}.ea-user .ea-role{display:none}}

</style>
